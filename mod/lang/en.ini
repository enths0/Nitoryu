; Nitoryu: Dual Wielding Combat System - English texts (the reference file).
; To translate: see TRANSLATING.md in this folder. Save as UTF-8.
; Each key has a comment: where the text appears, and "max N" = the longest
; text that fits there (characters). \n in a value = a line break.

[Text]

; Speech bubble over a character when it draws two weapons, or when the
; player turns the dual stance on with Alt+Shift+N. max 30
speech.two_blades=Two blades.

; Speech bubble when the player turns the dual stance off (Alt+Shift+N). max 30
speech.one_blade=One blade.

; Speech bubbles when the player lets a character pair blunt weapons and hackers
; (the second inventory button), and when he takes it back. max 30
speech.any_weapon=Any weapon.
speech.blades_only=Blades only.

; Speech bubble over an enemy who is under full pressure from a dual-blade
; master and can only block. max 30
speech.pressured=Can't find an opening!

; 0.40: speech bubble over a dual fighter (rank 4) who enters flow after being
; attacked several times in a row. Test builds only. max 30
speech.flow=Flow.

; 0.40: speech bubble over a master (rank 5) whose twin strike landed and chains
; another one. Test builds only. max 30
speech.mugen=Mugen.

; 0.42: speech bubble over a dual fighter (rank 4) whose left blade went to a
; second enemy at the flank. Test builds only. max 30
speech.split=Both of you.

; 1.0.2: the text next to the mouse when it is over one of the small marks (on a squad
; portrait or above a head): the skill's name, then what it does. \n = a new line; keep
; each line under 60 characters. max 220 each
tip.flow=Flow\nAttacked several times in a row, the fighter concentrates:\nfaster attacks and harder cuts until the bar runs out.
tip.mugen=Mugen\nA twin strike landed and chains:\nthe next attack is a twin strike again.
tip.pressure=Pressure\nEvery hit of yours the enemy blocks adds a stack.\nThe more stacks, the less the enemy attacks.\nA hit the enemy lands on you breaks it.

; 1.0.2: the text next to the mouse when it is over one of the two buttons on the back
; weapon slot in the inventory: the button's name, then what it does. \n = a new line;
; keep each line under 60 characters. max 260 each
tip.stance_button=Two blades\nOn: the character fights with both carried weapons.\nOff: with one, as in vanilla. Saved with the character.
tip.any_weapon_button=Any weapon\nLets this character pair blunt weapons and hackers.\nThey have no moves of their own. Saved with the character.\nOther weapon types are not supported:\nheavy weapons, polearms and bows are two-handed.

; Stats window, weapons column: the skill's name, next to its number. max 22
; (0.36: was "Ambidexterity"; the save key stays, old saves keep their value)
stats.label=Dual Wielding

; Stats window, left description panel (when the mouse is over the skill):
; heading of the list of what the skill affects. max 30
stats.affects_title=Stats Affected:

; Left description panel: what the skill affects. max 70
stats.affects=-Dual wielding, and fighting left-handed with a crippled right arm

; Left description panel: heading of the ways to train it. max 30
stats.train_title=Ways To Train:

; Left description panel: how to train it. max 70
stats.train=-Fighting with two weapons, or left-handed; a Pair Training Dummy

; Right description panel: heading above the description. max 30
stats.description_title=Description:

; Right description panel: the description (wraps; no limit that matters). max 400
stats.description=Skill at fighting with a weapon in each hand. It is trained only by fighting with two weapons or left-handed. It learns faster while it is below your weapon skill, and slower once it is above it.

; 1.0.2: right description panel, under the description: how the Path is counted. The
; heading (max 30), the formula and a short note (both wrap; max 400). Keep {skill} {dex}
; {atk} {def} {dw}: the weights in percent. A | starts a new line (here: one part per line).
stats.path_title=The Path:
stats.path_formula=The Path is the sum of five parts, each counted up to 100:|-{skill}% the lower of your two weapon skills|-{dex}% Dexterity|-{atk}% Melee Attack|-{def}% Melee Defence|-{dw}% Dual Wielding
stats.path_note=They count as they are in a fight: wounds, armour and overload lower them, and the Path with them.

; 1.0.2: right description panel: what the small marks above a fighter's head mean and
; give. The heading (max 30), then one paragraph per mark (wraps; max 400). Keep {max}
; (the most stacks), {attacks}, {window} and {duration} (seconds). A | starts a new line;
; the part before the first | is the mark's name and shows in the headings' colour.
stats.marks_title=Marks above the head:
stats.mark_pressure=Diamonds over an enemy: pressure|Every hit of yours the enemy blocks adds one (up to {max}). The more there are, the less the enemy attacks. A hit the enemy lands on you clears them.
stats.mark_flow=Wave: flow|After {attacks} enemy attacks within {window} s the fighter attacks faster and cuts harder for {duration} s. The bar is the time left.
stats.mark_mugen=Loop: Mugen|A twin strike landed, so the next attack is a twin strike again.

; Right description panel: the label of the progress bar to the next level. max 30
stats.next_level=Next Level:

; Left description panel, 0.11.1: the Dual Wielding that counts in a fight right
; now (after overload and heavy armour); the number follows. max 30
stats.in_fight=In a fight now:

; Left description panel: shown when overloaded; "13%: x0.68" follows. max 30
stats.overloaded=-Overloaded

; Left description panel: shown while worn heavy or medium armour cuts Dual Wielding; "x0.79" follows. max 30
stats.heavy_armour=-Armour

; Left description panel: the Path, the skill with two blades built from weapon
; skill, Dexterity, melee attack/defence and Dual Wielding; "Ronin (62)" follows. max 30
stats.proficiency=Path:

; 0.36: the five rank names, shown as "Ronin (62)". Empty = "62 (rank 3)". max 12 each
stats.rank1=Deshi
stats.rank2=Bushi
stats.rank3=Ronin
stats.rank4=Kenshi
stats.rank5=Kensei

; 0.40: left description panel, the heading of the list of the five ranks. max 30
stats.ranks_title=Ranks:

; 0.40: what each rank opens, after its name: "Ronin: twin strikes, ...". A rank not
; reached yet shows greyed with what it needs first. max 50 each
stats.rank1_opens=second-blade strikes
stats.rank2_opens=second-blade parries
stats.rank3_opens=twin strikes, ripostes, Cross, Dash, pressure
stats.rank4_opens=flow, the spin, two enemies at once
stats.rank5_opens=Mugen

; 0.40: what a rank needs, in brackets after a locked rank's name. Keep {dp} (the Path
; needed) and {amb} (the Dual Wielding needed). max 34
stats.rank_needs=Path {dp}, Dual Wielding {amb}

; 0.40: the same for a rank that only needs the Path. Keep {dp}. max 20
stats.rank_needs_dp=Path {dp}

; 0.40: the game's message line when a player character reaches a new rank (the
; character also says the rank's name). Keep {who} and {rank}. max 80
stats.rank_up={who} has reached the rank of {rank}.

; 1.0.5: a second message line right after it: what the new rank opens ({opens} is the
; stats.rankN_opens text of that rank). Keep {rank} and {opens}. Empty = no second line. max 40
stats.rank_up_opens={rank} opens: {opens}.

; The word before the rank number in "62 (rank 3)", used only for a rank left without
; a name above. max 10
stats.tier=rank

; 0.20: after "Bushi (62)" when Dual Wielding holds the rank back: what the next
; rank needs. Keep {amb} (the Dual Wielding needed) and {next} (the rank's name). max 40
stats.tier_capped={amb} Dual Wielding for {next}

; 0.20: the dual stance's own multiplier on attack and block speed (already
; included in the game's "Attack speed" on the Dexterity hover); "x1.04" follows. max 30
stats.speed=Dual speed bonus:

; 0.23: a dual fighter's Dexterity counts more in a fight (damage and speed); "+12%" follows. max 30
stats.dex_bonus=Dexterity in a fight:

; 0.42: what the carried pair of weapons gives; one or two of the texts below follow. max 12
stats.pair=Pair:

; 0.42: a long blade with a short one; {x} = "x1.15". max 40
stats.pair_long_short=long + short, parry {x}

; 0.42: two blades of about the same length; {x} = "x1.15". max 40
stats.pair_equal=equal blades, twin strikes {x}

; 0.42: two weapon types (katana + sabre). max 40
stats.pair_mixed=two types, full defence bonus

