; NEW STRING
; MT
stats.path_formula=道由五个部分组成，每部分最多按 100 计算：|-{skill}% 两项武器技能中较低的一项|-{dex}% 敏捷|-{atk}% 近战攻击|-{def}% 近战防御|-{dw}% 双持
; NEW STRING
; MT
stats.path_note=按战斗中的实际数值计算：受伤、重甲和超载会降低它们，道也随之降低。

