; 0.40: строка сообщения игры, когда персонаж игрока берёт новый ранг (сам персонаж
; произносит название ранга). Оставьте {who} и {rank}. max 80
stats.rank_up={who}: взят ранг {rank}.

; 1.0.5: вторая строка сообщения сразу за первой: что открывает новый ранг ({opens} это
