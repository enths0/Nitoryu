[Text]

; Реплика над персонажем, когда он достаёт два клинка или игрок включает стойку (Alt+Shift+N).
speech.two_blades=Два клинка.

; Реплика, когда игрок выключает стойку (Alt+Shift+N).
speech.one_blade=Один клинок.

; Реплики, когда игрок разрешает персонажу пару из дробящего и тесаков (вторая кнопка в инвентаре), и когда убирает.
speech.any_weapon=Любое оружие.
speech.blades_only=Только клинки.

; Над врагом, которого мастер двух клинков задавил натиском: он только блокирует.
speech.pressured=Не пробиться!

; 0.40: над бойцом (ранг 4), который вошёл в поток после нескольких атак по нему подряд. Только в тестовых сборках.
speech.flow=Поток.

; 0.40: над мастером (ранг 5), чей парный удар попал и тянет за собой следующий. Только в тестовых сборках.
speech.mugen=Мугэн.

; 0.42: над бойцом (ранг 4), чей левый клинок ушёл во второго врага сбоку. Только в тестовых сборках.
speech.split=Обоих.

; 1.0.2: текст рядом с мышью, когда она над одной из маленьких меток (на портрете отряда
; или над головой): название навыка, потом что он делает. \n = новая строка; строки
; не длиннее 60 символов. max 220
tip.flow=Поток\nБойца атаковали несколько раз подряд, он сосредоточен:\nудары быстрее и режут сильнее, пока не кончится полоска.
tip.mugen=Мугэн\nДвойной удар попал, идёт цепочка:\nследующая атака снова будет двойным ударом.
tip.pressure=Давление\nКаждый ваш удар, который враг заблокировал, даёт стак.\nЧем больше стаков, тем реже враг атакует.\nЕсли враг попал по вам, давление сброшено.

; 1.0.2: текст рядом с мышью, когда она над одной из двух кнопок на слоте оружия на спине
; в инвентаре: название кнопки, потом что она делает. \n = новая строка; строки не длиннее
; 60 символов. max 260
tip.stance_button=Два клинка\nВкл: персонаж дерётся обоими оружиями, что на нём.\nВыкл: одним, как в ванилле. Сохраняется с персонажем.
tip.any_weapon_button=Любое оружие\nЭтот персонаж берёт в пару дробящее и тесаки.\nСвоих приёмов у них нет. Сохраняется с персонажем.\nДругие виды оружия не поддерживаются:\nтяжёлое, древковое оружие и луки держат двумя руками.

; Окно характеристик, колонка оружия: название навыка.
stats.label=Парный бой

; Левая панель описания (при наведении): заголовок списка влияния.
stats.affects_title=Влияет на:

; Левая панель: на что влияет навык.
stats.affects=-Бой двумя клинками и левой рукой при покалеченной правой

; Левая панель: заголовок способов тренировки.
stats.train_title=Как тренировать:

; Левая панель: как тренировать.
stats.train=-Бой двумя оружиями или левой рукой; парный манекен

; Правая панель: заголовок описания.
stats.description_title=Описание:

; Правая панель: описание (переносится по строкам).
stats.description=Умение сражаться оружием в каждой руке. Тренируется только в бою двумя оружиями или левой рукой. Пока навык ниже навыка владения оружием, он растёт быстрее, а когда выше, медленнее.

; 1.0.2: правая панель описания, под описанием: как считается путь. Заголовок (max 30),
; формула и короткая заметка (переносятся; max 400). Оставьте {skill} {dex} {atk} {def}
; {dw}: веса в процентах.
stats.path_title=Путь:
stats.path_formula=Путь складывается из пяти частей, каждая считается до 100:|-{skill}% меньший из двух навыков оружия|-{dex}% ловкость|-{atk}% атака в ближнем бою|-{def}% защита в ближнем бою|-{dw}% парный бой
stats.path_note=Значения берутся такими, какие они в бою: раны, броня и перегруз снижают их, а с ними и путь.

; 1.0.2: правая панель описания: что значат и что дают маленькие метки над головой бойца.
; Заголовок (max 30), потом по абзацу на метку (переносятся; max 400). Оставьте {max}
; (предел стаков), {attacks}, {window} и {duration} (секунды).
stats.marks_title=Метки над головой:
stats.mark_pressure=Ромбы над врагом: давление|Каждый ваш удар, который враг заблокировал, добавляет ромб (до {max}). Чем их больше, тем реже враг атакует. Если враг попал по вам, они пропадают.
stats.mark_flow=Волна: поток|После {attacks} вражеских атак за {window} с боец бьёт быстрее и режет сильнее {duration} с. Полоска показывает, сколько осталось.
stats.mark_mugen=Петля: Мугэн|Двойной удар попал, поэтому следующая атака снова будет двойным ударом.

; Правая панель: подпись полосы до следующего уровня.
stats.next_level=Следующий уровень:

; Левая панель, 0.11.1: парный бой, который считается в бою прямо сейчас (с учётом перегруза и тяжёлой брони). max 30
stats.in_fight=Сейчас в бою:

; Показывается при перегрузе; дальше «13%: x0.68». max 30
stats.overloaded=-Перегруз

; Показывается, пока надетая тяжелая или средняя броня снижает парный бой; дальше «x0.79». max 30
stats.heavy_armour=-Броня

; Путь: мастерство парного боя (из навыка оружия, ловкости, атаки/защиты и навыка «Парный бой»); дальше «Ронин (62)». max 30
stats.proficiency=Путь:

