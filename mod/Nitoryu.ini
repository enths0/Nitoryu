; Nitoryu settings. Read when the game starts. 1 = on, 0 = off.
; A line starting with ";" shows the default: remove the ";" to set your own
; value (it then wins over the game data a mod or modpack ships through FCS).

[General]
; prod = release, stage = test build (speech bubbles, a detailed log)
env=prod
; auto = the game's language, or a code with a file in lang\ (en, ru, zh, ja)
language=auto
; the log's detail: off, normal, stage, verbose
; diag=normal

[UI]
; the two-blades button on the back weapon slot, its size in pixels
toggle_button=1
button_size=22
; the second button next to it, shown on a character who carries two blunt weapons or hackers:
; it lets this character fight with them as a pair (saved with the character)
any_weapon_button=1
; the mouse over a button says what it does
button_tips=1
; a key for the same: alt+n, shift+n, n (empty = none)
hotkey=

[Stats]
; the Dual Wielding line, ranks coloured like item grades, the rank-up message
show=1
rank_colours=1
rank_up_message=1
; the same in the title of the stats window
rank_in_title=0
; the character panel's Attack and Defense count the second blade while the pair is drawn
panel_pair_bonus=1
; where the Dual Wielding line sits: 1 = at the end of the Weapons group, 2 = in the Combat group
;group=1

[Marks]
; small marks above the head, so you can see the rank skills work (no text):
; a wave = flow (the bar under it runs out with it), a loop = a Mugen chain is waiting,
; diamonds over an enemy = pressure stacks (they turn red at full pressure).
; what they mean is in the Dual Wielding description in the stats window
; 0 = none, 1 = the characters I have selected, 2 = all my characters, 3 = every fighter
; marks=1
; where: 2 = above the heads, 1 = on the squad portraits, 3 = both
; place=2
; one switch each
; flow=1
; mugen=1
; pressure=1
; the mouse over a mark says what the skill does
; tips=0
; the size of a mark in pixels, and how high above the feet it sits when the name is not shown
; size=22
; height=24
; 1 = on top of the character's name, 0 = always at height
; on_name=1

[Animations]
; my own animations, one switch each; 0 = the game's mirrored animation
; blocks and hits
high_block=1
offhand_block=1
; where the free blade goes: mix, low, forward
offhand_block_style=mix
scissor_block=1
dual_block=1
angled_block=1
; 1 if the angled block leans away from the blow
angled_block_swap=0
main_block=1
main_block_single=1
hit_taken=1
; draw, sheathe, the blood flick after a won fight
dual_draw=1
dual_sheathe=1
dual_chiburi=1
; the flick and the sheathe are skipped when the blades go home for a job of the hands (first aid, looting, lifting)
sheathe_yields_to_jobs=1
; staggered, knocked down, knocked out, getting up: the game's own animation shows (0 = the dual pose stays on)
; yield_to_reactions=1
; running with the blades out, a stance per rank in a fight
run_hold=1
; over another mod's run it can't keep in step with, the torso takes this share of the run pose (0 = none, 1 = all)
; run_hold_free_weight=0.5
idle_stances=1
; left-hand fighting: the crippled arm swings as the body moves (0 = it hangs still)
limp_arm_swing=1
; the specials' look
x_cut=1
dash_slash=1
; these are moves of their own: 0 = the move is not used
off_rising_cut=1
twin_sweep=1
spin=1
one_two=1
off_backhand=1
beat_cut=1
double_chop=1
off_leg_cut=1
fan_sweep=1
head_wrap=1
dual_cut=1
off_hand_cut=1
main_hand_cut=1
figure_eight=1
three_cuts=1
; the four back guards: a blow from behind caught by the second blade or the main one, low or high
back_guard=1

[Moves]
; the Dash slash and the Spin as moves: 0 = never used
dash_slash=1
spin=1
; cooldowns in milliseconds of game time
; dash_cooldown_ms=12000
; spin_cooldown_ms=20000
; spin_min_skill=75
; double_hit_cooldown_ms=5000
; 1 = of the moves that come up, the fighter takes the one it has used least (every move seen about as often)
; even_picks=1
; chance that the answer to a block is the X cut; otherwise an ordinary riposte
; cross_riposte_chance=0.25
; no_repeat=1
; offhand_carry=1
; far_pick_gap=35
; other mods' long moves: played with both blades, on the Dash's cooldown
; mirror_long_dash=1
; long_dash_shared_cooldown=1
; the Cross as a riposte after a block
; cross_riposte=1
; cross_riposte_window_ms=1500
; cross_arm_ms=2000

[NPC]
; which NPCs fight with two blades: all, authored (only the opted-in), off
; dual=all
; the highest rank an NPC fights at
; max_tier=3
; CHARACTER or FACTION ids that always fight dual, comma separated
opt_in=
; Dual Wielding for a CHARACTER or FACTION id, comma separated: skill=<id>:<value>,<id>:<value>
skill=
; the lowest Path (0-100) for a CHARACTER or FACTION id, comma separated: path=<id>:<value>,<id>:<value>
path=

[Weapons]
; categories allowed in a pair: 0 katanas, 1 sabres, 2 blunt, 4 hackers
; categories=0,1

[Speed]
; the speed bonus at Dexterity 100 + Path 100, the attack and block caps
; dual_speed_bonus=0.3
; dual_attack_cap=1.5
; dual_block_cap=4.0

[Guard]
; the second blade's parry (rank 2+) and the riposte (rank 3+)
; guard=1
; cooldown_ms=1000
; arc_deg=110
; the back guard: from this rank a blade guards the back (6 = never); the share of the parry chance there
; back_min_tier=3
; back_share=0.5
; counter=1
; counter_window_ms=1500
; -1 = by the [Balance] curve
; counter_chance=-1
; parry_pose=1.0
; parry_ms=650

[Pressure]
; rank 3+: every hit an enemy blocks piles pressure on them
; pressure=1
; max_stacks=5
; decay_ms=3000
; -1 = by the [Balance] curve
; points=-1
; tempo=0

[Flow]
; rank 4: attacked `attacks` times within window_ms = faster and harder for duration_ms
; flow=1
; attacks=3
; window_ms=5000
; duration_ms=4000
; cooldown_ms=5000
; dex_bonus=0.12
; speed=0.04
; cap_bonus=0.3

[Mugen]
; rank 5: a shorter double-hit cooldown, chained twin strikes (Path:value)
; mugen=1
; cooldown_ms=90:3500,100:2000
; chain=90:0.25,100:0.5

[Pair]
; what you pair: long + short parries better, equal blades twin more,
; katana + sabre takes the sabre's defence bonus
; pair=1
; short_ratio=0.80
; equal_ratio=0.90
; long_short_parry=1.30
; equal_twin_share=1.30
; mixed_defence_share=1.0

[Scissor]
; rank 3+: both blades of a twin strike hit the same body part (Path:chance)
; scissor=1
; chance=59.99:0,60:0.8,75:1.0

[Split]
; rank 4: the left blade of a twin strike lands on a second enemy at the flank
; split=1
; chance=75:1.0,100:1.0
; arc_deg=180
; reach=2.5
; attacker_ms=8000

[Training]
; the Pair Training Dummies train Dual Wielding
; pair_dummy=1
; Dual Wielding XP by deed: a parry with the second blade (x a plain block), a hit of a two-blade move,
; the impacts of a riposte, and everything while two or more enemies attack the fighter
; xp_parry=2.0
; xp_twin=1.5
; xp_riposte=1.5
; xp_outnumbered=1.5
; xp_outnumbered_ms=5000
; a hit taken trains Dual Wielding: this share of the Melee Defence XP of that hit (0 = off)
; xp_hit_taken=0.25

[LeftHand]
; fighting left-handed with a crippled or missing right arm
; enabled=1
; min_ambidexterity=50
; damage_at_min=0.7
; speed_at_min=0.85
; block_penalty_at_min=10

[Compat]
; a mod that swings, blocks and switches weapons itself (direct control, e.g. ShoulderCombat):
; my animations give way to it. off, auto (only when one of the plugins below is loaded), on (always)
; foreign_control=auto
; plugins=ShoulderCombat.dll
; for this long after its last swing or block the run animation waits for a steady run (run_ms)
; hold_ms=6000
; run_ms=300

[Balance]
; curves "Path:value,Path:value", straight lines between the points
; off_hand_share=20:0.03,40:0.10,60:0.18,75:0.30,85:0.40,90:0.50,100:0.55
; twin_share=59.99:0,60:0.25,100:0.45
; off_hand_damage=20:1.04,40:1.14,70:1.30
; off_hand_guard=39.99:0,40:0.20,60:0.30,75:0.40,90:0.50,100:0.55
; counter_chance=59.99:0,60:0.30,100:0.60
; pressure_points=60:1,100:1
; tempo=59.99:0,60:1.0,80:3.0,100:5.0
; the block penalty per rank 0..5
; divided_guard=4,4,2,0,0,0
; dex_bonus=0.12

[OffHand]
; the pose of the left arm; leave it alone unless a race looks wrong
; show_blade=1
; mirror_pose=1
; square_torso=0.8
; uncross=0.7
; swap_strikes=1
; blend_ms=80
